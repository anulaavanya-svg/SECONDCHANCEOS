<title>OpportunityGraph AI — Live Demo</title>

  .btn:hover { background: var(--accent-bright); transform: translateY(-1px); }

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   OpportunityGraph AI — engine (faithful client-side port of lib/opportunitygraph)
   ══════════════════════════════════════════════════════════════════════════ */

const DIMENSION_KEYS = ["fluidReasoning","verbalReasoning","quantReasoning","conscientiousness","openness","adaptability","growthMindset","selfEfficacy","intrinsicMotivation"];
const SHORT = {
  fluidReasoning:"Problem-solving", verbalReasoning:"Verbal", quantReasoning:"Quant",
  conscientiousness:"Reliability", openness:"Curiosity", adaptability:"Adaptability",
  growthMindset:"Growth mindset", selfEfficacy:"Self-efficacy", intrinsicMotivation:"Motivation"
};
const RIASEC_KEYS = ["R","I","A","S","E","C"];

const HPI_WEIGHTS = { fluidReasoning:.14, verbalReasoning:.08, quantReasoning:.08, conscientiousness:.16, openness:.10, adaptability:.12, growthMindset:.11, selfEfficacy:.11, intrinsicMotivation:.10 };
const CRYSTALLIZED = ["verbalReasoning","quantReasoning"];
const CONTEXT_BONUS_MAX = 5;

const clamp = (v,lo=0,hi=100)=> Number.isNaN(v)?lo:Math.min(hi,Math.max(lo,v));
const clamp01 = v => Number.isNaN(v)?0:Math.min(1,Math.max(0,v));
const round1 = v => Math.round(v*10)/10;

/* ── Instrument ─────────────────────────────────────────────────────────── */
const ITEMS = [
  { id:"fr-seq-1", kind:"task", dimension:"fluidReasoning", prompt:"What number continues the pattern?  2, 6, 12, 20, 30, ___", options:["36","40","42","44"], answerIndex:2 },
  { id:"fr-sjt-1", kind:"sjt", dimension:"fluidReasoning", prompt:"You are given a task you have never done before, with no instructions. What do you do first?", options:[
    {label:"Wait until someone explains exactly how to do it.", credit:.1},
    {label:"Break it into smaller parts and test one part to see what happens.", credit:1.0},
    {label:"Copy how a similar task was done, even if it may not fit.", credit:.5},
    {label:"Skip it and move to something familiar.", credit:.2}] },
  { id:"vr-analogy-1", kind:"task", dimension:"verbalReasoning", prompt:"Scarce is to plentiful as reckless is to ___", options:["dangerous","careful","quick","wealthy"], answerIndex:1 },
  { id:"qr-word-1", kind:"task", dimension:"quantReasoning", prompt:"A program costs $240. A grant covers 35% of it. About how much do you still pay?", options:["$84","$120","$156","$205"], answerIndex:2 },
  { id:"co-likert-1", kind:"likert", dimension:"conscientiousness", prompt:"I follow through on commitments, even when no one is checking." },
  { id:"co-likert-2", kind:"likert", dimension:"conscientiousness", prompt:"I often leave things until the last minute.", reverse:true },
  { id:"co-sjt-1", kind:"sjt", dimension:"conscientiousness", prompt:"You promised a deadline but realize you are running late. What do you do?", options:[
    {label:"Say nothing and hope no one notices.", credit:0},
    {label:"Tell them early, and propose a new realistic time.", credit:1.0},
    {label:"Rush and hand in something unfinished on time.", credit:.4},
    {label:"Wait until they ask before responding.", credit:.2}] },
  { id:"op-likert-1", kind:"likert", dimension:"openness", prompt:"I enjoy learning about topics far outside my usual interests." },
  { id:"op-likert-2", kind:"likert", dimension:"openness", prompt:"I prefer to stick to what I already know rather than try new approaches.", reverse:true },
  { id:"ad-likert-1", kind:"likert", dimension:"adaptability", prompt:"When plans change suddenly, I adjust without getting stuck." },
  { id:"ad-sjt-1", kind:"sjt", dimension:"adaptability", prompt:"You worked hard on a plan and it fails badly. A week later, you are most likely to:", options:[
    {label:"Have given up on that goal.", credit:.1},
    {label:"Be trying a changed version of the plan.", credit:1.0},
    {label:"Be waiting for the right moment, unsure what to change.", credit:.4},
    {label:"Be doing the same thing again, blaming circumstances.", credit:.2}] },
  { id:"gm-likert-1", kind:"likert", dimension:"growthMindset", prompt:"How good I am at something can change a lot with effort and practice." },
  { id:"gm-likert-2", kind:"likert", dimension:"growthMindset", prompt:"People are born with a fixed amount of talent that they cannot really change.", reverse:true },
  { id:"se-likert-1", kind:"likert", dimension:"selfEfficacy", prompt:"If I work at it, I can usually solve problems that seem hard at first." },
  { id:"se-likert-2", kind:"likert", dimension:"selfEfficacy", prompt:"What happens in my life is mostly outside of my control.", reverse:true },
  { id:"im-likert-1", kind:"likert", dimension:"intrinsicMotivation", prompt:"I get absorbed in work that I find genuinely interesting." },
  { id:"im-likert-2", kind:"likert", dimension:"intrinsicMotivation", prompt:"I only put in effort when there is a reward or a grade at stake.", reverse:true },
  { id:"ri-R", kind:"interest", riasec:"R", prompt:"I like building, fixing, or working with my hands and tools." },
  { id:"ri-I", kind:"interest", riasec:"I", prompt:"I like investigating problems, analyzing data, and figuring out why things work." },
  { id:"ri-A", kind:"interest", riasec:"A", prompt:"I like creating, designing, writing, or expressing ideas." },
  { id:"ri-S", kind:"interest", riasec:"S", prompt:"I like helping, teaching, or supporting other people." },
  { id:"ri-E", kind:"interest", riasec:"E", prompt:"I like leading, persuading, starting things, and taking charge." },
  { id:"ri-C", kind:"interest", riasec:"C", prompt:"I like organizing, keeping things accurate, and working with clear systems." },
];

/* ── Scoring ────────────────────────────────────────────────────────────── */
function scoreItem(item, raw){
  if(raw===undefined||raw===null||Number.isNaN(raw)) return null;
  if(item.kind==="likert"){ const v=Math.min(5,Math.max(1,raw)); const n=((v-1)/4)*100; return item.reverse?100-n:n; }
  if(item.kind==="sjt"){ const o=item.options[raw]; return o?o.credit*100:null; }
  if(item.kind==="task"){ return raw===item.answerIndex?100:0; }
  return null;
}
function dimensionConfidence(n, onlyBinary){
  if(n<=0) return 0;
  const base = 1 - Math.exp(-0.9*n);
  const cap = (onlyBinary && n<2) ? 0.5 : 0.95;
  return Math.min(cap, base);
}
function scorePotential(responses, constraints){
  constraints = constraints || {};
  const detail = DIMENSION_KEYS.map(key=>{
    const items = ITEMS.filter(it=>it.kind!=="interest" && it.dimension===key);
    const contrib=[]; let onlyBinary=true;
    for(const it of items){ const s=scoreItem(it, responses[it.id]); if(s===null) continue; if(it.kind!=="task") onlyBinary=false; contrib.push(s); }
    const answered=contrib.length;
    const value = answered===0?50:contrib.reduce((a,b)=>a+b,0)/answered;
    return { key, value:clamp(value), confidence:dimensionConfidence(answered,onlyBinary), itemsAnswered:answered };
  });
  let contextAdjusted=false;
  if(constraints.firstGen){
    for(const d of detail){ if(CRYSTALLIZED.includes(d.key)){ const bonus=Math.min(CONTEXT_BONUS_MAX,(100-d.value)*0.08); if(bonus>0){ d.value=clamp(d.value+bonus); contextAdjusted=true; } } }
  }
  const dimensions={}; detail.forEach(d=>dimensions[d.key]=round1(d.value));
  const riasec={};
  for(const key of RIASEC_KEYS){
    const items=ITEMS.filter(it=>it.kind==="interest" && it.riasec===key);
    const vals=items.map(it=>responses[it.id]).filter(v=>v!==undefined&&!Number.isNaN(v)).map(v=>((Math.min(5,Math.max(1,v))-1)/4)*100);
    riasec[key]= vals.length?round1(vals.reduce((a,b)=>a+b,0)/vals.length):50;
  }
  let weighted=0, wsum=0;
  for(const d of detail){ const w=HPI_WEIGHTS[d.key]*(0.4+0.6*d.confidence); weighted+=dimensions[d.key]*w; wsum+=w; }
  const hpi=round1(wsum>0?weighted/wsum:50);
  const confidence=round1((detail.reduce((a,d)=>a+d.confidence,0)/detail.length)*100)/100;
  const strengths=[...detail].sort((a,b)=>b.value-a.value).slice(0,3).map(d=>d.key);
  const growthLevers=[...detail].sort((a,b)=>a.value-b.value).slice(0,3).map(d=>d.key);
  return { dimensions, riasec, hpi, confidence, strengths, growthLevers, contextAdjusted };
}

/* ── Matching ──────────────────────────────────────────────────────────── */
const W = { interest:.25, aptitude:.20, readiness:.20, growth:.20, values:.15, barrier:.15 };
const EDU_COST = { hs:0, certificate:4000, associate:12000, bachelor:40000, graduate:70000 };
const EDU_YEARS = { hs:0, certificate:.75, associate:2, bachelor:4, graduate:6 };
const WAGE_REF = 110000;
const OUTLOOK = { declining:.6, stable:.85, growing:1.0, "high-growth":1.15 };

function cosine(a,b){ let dot=0,na=0,nb=0; for(const k of RIASEC_KEYS){ dot+=a[k]*b[k]; na+=a[k]*a[k]; nb+=b[k]*b[k]; } return (na===0||nb===0)?0:dot/(Math.sqrt(na)*Math.sqrt(nb)); }
function aptitudeFit(dims,demands){ const keys=Object.keys(demands); if(!keys.length) return .7; let t=0; for(const k of keys){ const tg=demands[k]||0; t+= tg<=0?1:clamp01(dims[k]/tg); } return t/keys.length; }
function skillReadiness(held,required){ if(!required.length) return .5; const by=new Map(held.map(h=>[h.skillId,clamp01(h.proficiency)])); let n=0,d=0; for(const [sid,imp] of required){ d+=imp; n+=imp*(by.get(sid)||0); } return d>0?n/d:0; }
function growthPotential(c){ const wage=c.medianWageUsd||45000; return clamp01(clamp01(wage/WAGE_REF)*(OUTLOOK[c.growthOutlook]||.85)); }
function valuesFit(c,ct){ const cost=EDU_COST[c.typicalEducation]??20000; const yr=EDU_YEARS[c.typicalEducation]??2; let f=1;
  if(ct.maxCostUsd!==undefined && cost>ct.maxCostUsd) f*=clamp01((ct.maxCostUsd+4000)/(cost+4000));
  if(ct.weeklyHours!==undefined && yr>=4 && ct.weeklyHours<15) f*=.8;
  if(yr<=1) f=Math.min(1,f+.1); return clamp01(f); }
function accessBarrier(c,ct){ let b=clamp01(c.entryBarrier); const cost=EDU_COST[c.typicalEducation]??20000;
  if(ct.needBlindOnly && cost>0) b=Math.min(1,b+.15); if(ct.maxCostUsd!==undefined && cost>ct.maxCostUsd) b=Math.min(1,b+.1); return b; }
function rationaleFor(b){ const out=[]; const ord=[["interest","Strong fit with your interest profile"],["aptitude","Your measured strengths meet what this work demands"],["growth","High upward-mobility potential (pay and outlook)"],["readiness","You already hold several of the core skills"],["values","The path is reachable within your stated constraints"]];
  for(const [k,m] of ord){ if(b[k]>=65) out.push(m); } if(b.barrierPenalty>=60) out.push("Note: entry barrier is high — the roadmap prioritizes funded, need-blind steps"); if(!out.length) out.push("A balanced match across interest, aptitude, and reachability"); return out.slice(0,3); }

function matchCareers(input, careers){
  const held=input.heldSkills||[], ct=input.constraints||{};
  return careers.map(c=>{
    const interest=clamp01(cosine(input.riasec,c.riasec));
    const aptitude=clamp01(aptitudeFit(input.dimensions,c.demands));
    const readiness=clamp01(skillReadiness(held,c.skills));
    const growth=growthPotential(c);
    const values=valuesFit(c,ct);
    const barrier=accessBarrier(c,ct);
    const raw=W.interest*interest+W.aptitude*aptitude+W.readiness*readiness+W.growth*growth+W.values*values-W.barrier*barrier;
    const score=Math.round(clamp01((raw+W.barrier)/(1+W.barrier))*1000)/10;
    const breakdown={ interest:Math.round(interest*100), aptitude:Math.round(aptitude*100), readiness:Math.round(readiness*100), growth:Math.round(growth*100), values:Math.round(values*100), barrierPenalty:Math.round(barrier*100) };
    return { slug:c.slug, title:c.title, cluster:c.cluster, wage:c.medianWageUsd, edu:c.typicalEducation, score, breakdown, rationale:rationaleFor(breakdown) };
  }).sort((a,b)=>b.score-a.score);
}

/* ── Graph: gaps, opportunity ranking, roadmap ─────────────────────────── */
const GAP_T=.05;
function skillGaps(career, held){
  const by=new Map(held.map(h=>[h.skillId,clamp01(h.proficiency)]));
  return career.skills.map(([sid,imp])=>{ const p=by.get(sid)||0; return { skillId:sid, name:SKILLS[sid]||sid, importance:imp, currentProficiency:p, gapValue:imp*(1-p) }; })
    .filter(g=>g.gapValue>GAP_T).sort((a,b)=>b.gapValue-a.gapValue);
}
function accessibility(o,ct,now){
  if(o.deadline && o.deadline<now) return 0;
  const eff=o.needBlind?0:o.costUsd;
  if(ct.needBlindOnly && eff>0) return 0;
  let a=1;
  if(ct.maxCostUsd!==undefined && eff>ct.maxCostUsd) a*=clamp01((ct.maxCostUsd+200)/(eff+200));
  if(!o.remoteOk && ct.locationState && o.locationState && o.locationState!==ct.locationState) a*=.2;
  if(ct.weeklyHours!==undefined && o.weeklyHours && o.weeklyHours>ct.weeklyHours) a*=clamp01(ct.weeklyHours/o.weeklyHours);
  if(o.deadline){ const days=(o.deadline-now)/DAY; if(days<14) a*=.7; }
  return clamp01(a);
}
function rankOpportunities(gaps, opps, ct){
  const now=Date.now(); const gById=new Map(gaps.map(g=>[g.skillId,g]));
  return opps.map(o=>{ let gcv=0; const closes=[]; for(const [sid,bw] of o.builds){ const g=gById.get(sid); if(!g) continue; gcv+=bw*g.gapValue; closes.push(sid); }
    const acc=accessibility(o,ct,now); const quality=1+(o.targetsUnderserved?.1:0)+(o.needBlind?.05:0);
    return { o, score:gcv*acc*quality, accessibility:acc, gapClosingValue:gcv, closes }; })
    .filter(r=>r.accessibility>0 && r.gapClosingValue>0).sort((a,b)=>b.score-a.score);
}
const PHASE_FOR={ COURSE:"foundation", SCHOLARSHIP:"foundation", MENTORSHIP:"foundation", INTERNSHIP:"build", PROGRAM:"build", APPRENTICESHIP:"build" };
const PHASE_ORD={ foundation:0, build:1, launch:2 };
function generateRoadmap(career, gaps, ranked){
  const maxOpps=4, covered=new Set(), chosen=[], pool=[...ranked];
  while(chosen.length<maxOpps && pool.length){
    let bi=-1, bm=0;
    for(let i=0;i<pool.length;i++){ const r=pool[i]; let m=0; for(const sid of r.closes){ if(covered.has(sid)) continue; const g=gaps.find(x=>x.skillId===sid); if(g) m+=g.gapValue; } m*=r.accessibility; if(m>bm){ bm=m; bi=i; } }
    if(bi===-1||bm<=0) break; const [p]=pool.splice(bi,1); chosen.push(p); p.closes.forEach(s=>covered.add(s));
  }
  const steps=[];
  steps.push({ phase:"foundation", kind:"milestone", title:`Commit to the path: ${career.title}`, description:"Confirm this target, set a weekly time budget, and tell one person who can hold you accountable.", estWeeks:1 });
  for(const r of chosen){ const o=r.o;
    steps.push({ phase:PHASE_FOR[o.type], kind:"opportunity", title:o.title, description:`${o.provider} · ${o.needBlind?"Fully funded":o.costUsd===0?"Free":"$"+o.costUsd}${r.closes.length?` · builds ${r.closes.length} of your target skills`:""}.`, estWeeks:o.estWeeks });
  }
  const leftover=gaps.filter(g=>!covered.has(g.skillId)).slice(0,3);
  for(const g of leftover){ steps.push({ phase:g.importance>=.7?"foundation":"build", kind:"skill", title:`Develop: ${g.name}`, description:"Self-directed practice with free resources, then apply it in a small real project you can show.", estWeeks:4 }); }
  steps.push({ phase:"launch", kind:"milestone", title:`Apply into ${career.title}`, description:"Package your projects into a portfolio, line up references from people you met, and apply to entry roles or programs.", estWeeks:3 });
  steps.sort((a,b)=>{ if(PHASE_ORD[a.phase]!==PHASE_ORD[b.phase]) return PHASE_ORD[a.phase]-PHASE_ORD[b.phase];
    if(a.kind==="milestone"&&b.kind!=="milestone") return a.phase==="launch"?1:-1;
    if(b.kind==="milestone"&&a.kind!=="milestone") return b.phase==="launch"?-1:1;
    return (a.estWeeks||0)-(b.estWeeks||0); });
  steps.forEach((s,i)=>{ s.order=i+1; s.status="NOT_STARTED"; });
  const totalW=steps.reduce((a,s)=>a+(s.estWeeks||0),0);
  return { horizonMonths:Math.max(3,Math.round(totalW/4.3)), steps };
}

          <label><input type="checkbox" id="cx-needblind" ${c.needBlindOnly?"checked":""}> Only show fully-funded options</label>
        </div>
      </div>
    </div>
    <div class="assess-foot"><span class="sub" style="margin:0">${answered} of ${total} answered</span>
      <button class="btn" id="submit" ${answered<5?"disabled":""}>See my potential profile →</button></div>
    <div style="height:20px"></div>
  </div></div>`;
}

/* ── Radar (inline SVG) ── */
function radarSVG(dims){
  const size=300, cx=size/2, cy=size/2, R=110, n=DIMENSION_KEYS.length;
  const ang=i=>(-Math.PI/2)+(i*2*Math.PI/n);
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
  let rings="";
  [.25,.5,.75,1].forEach(f=>{ const p=DIMENSION_KEYS.map((_,i)=>pt(i,R*f).map(x=>x.toFixed(1)).join(",")).join(" "); rings+=`<polygon points="${p}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  let spokes="", labels="";
  DIMENSION_KEYS.forEach((k,i)=>{ const [x,y]=pt(i,R); spokes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    const [lx,ly]=pt(i,R+22); const anchor=Math.abs(lx-cx)<6?"middle":(lx>cx?"start":"end");
    labels+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" font-size="10" fill="var(--muted)" text-anchor="${anchor}">${SHORT[k]}</text>`; });
  const poly=DIMENSION_KEYS.map((k,i)=>pt(i,R*(dims[k]/100)).map(x=>x.toFixed(1)).join(",")).join(" ");
  const dots=DIMENSION_KEYS.map((k,i)=>{ const [x,y]=pt(i,R*(dims[k]/100)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--radar)"/>`; }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:340px" role="img" aria-label="Potential radar chart">${rings}${spokes}
    <polygon points="${poly}" fill="var(--radar)" fill-opacity="0.22" stroke="var(--radar)" stroke-width="2"/>${dots}${labels}</svg>`;
}

/* ── Results ── */
function viewResults(){
  const r=state.result, m=state.matches, confPct=Math.round(r.confidence*100);
  const strengthRow = k=>`<div class="lever"><span class="dot" style="background:var(--accent)"></span>${SHORT[k]}</div>`;
  const leverRow = k=>`<div class="lever"><span class="dot" style="background:var(--amber)"></span>${SHORT[k]}</div>`;
  return `<div class="view"><div class="wrap">
    <div class="results-head"><div><div class="eyebrow">Your profile</div><h1 class="display" style="font-size:1.9rem;margin-top:8px">Human Potential Index</h1></div>
      <button class="btn sec sm" data-go="assess">← Adjust answers</button></div>
    <div class="grid-main">
      <div class="card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
          <div><div class="hpi-big mono" style="color:var(--accent)">${r.hpi}</div>
            <p class="sub" style="margin-top:4px">Composite of nine developable dimensions</p></div>
          <span class="chip ${confPct>=60?"em":"am"}">Confidence ${confPct}%</span>
        </div>
        <div class="radar-wrap">${radarSVG(r.dimensions)}</div>
        ${confPct<60?`<p class="legend-note" style="color:var(--amber)">Confidence is modest — answering more of the assessment sharpens your profile.</p>`:`<p class="legend-note">Each dimension is scored 0–100 with its own confidence band.</p>`}
        ${r.contextAdjusted?`<p class="legend-note">Context-adjusted: crystallized scores were opportunity-adjusted for declared first-gen access.</p>`:``}
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card"><h3>Your strengths</h3><div style="margin-top:8px">${r.strengths.map(strengthRow).join("")}</div></div>
        <div class="card"><h3>High-leverage to develop</h3><div style="margin-top:8px">${r.growthLevers.map(leverRow).join("")}</div>
          <p class="sub" style="margin-top:10px">Not weaknesses — where growth moves your index the most.</p></div>
      </div>
    </div>
    <div class="matches-head"><h2 class="display" style="font-size:1.35rem">Career matches</h2><span class="sub">Ranked by fit, mobility &amp; reachability</span></div>
    <div class="match-grid">${m.map(matchCard).join("")}</div>
    <div style="height:24px"></div>
  </div></div>`;
}
function toneClass(s){ return s>=70?"em":s>=50?"na":"am"; }
function matchCard(mt){
  const b=mt.breakdown;
  const bars=[["interest","Interest fit"],["aptitude","Aptitude fit"],["readiness","Skill readiness"],["growth","Mobility potential"],["values","Reachability"]];
  return `<div class="card match" data-card="${mt.slug}">
    <div class="top"><div><h3>${esc(mt.title)}</h3><p class="sub">${esc(mt.cluster)} · $${(mt.wage/1000).toFixed(0)}k median</p></div>
      <span class="chip ${toneClass(mt.score)}">${mt.score}% match</span></div>
    <p class="sub" style="margin-top:8px;color:var(--ink)">${esc(mt.rationale[0])}</p>
    <button class="why" data-toggle="${mt.slug}">Why this match?</button>
    <div class="brk" id="brk-${mt.slug}">
      ${bars.map(([k,l])=>`<div class="brkrow"><span class="lb">${l}</span><div class="track"><div style="width:${b[k]}%"></div></div><span class="vl mono">${b[k]}</span></div>`).join("")}
      ${b.barrierPenalty>=60?`<p class="sub" style="color:var(--amber);margin-top:2px">High entry barrier — the roadmap prioritizes funded, need-blind steps.</p>`:``}
      <ul class="rlist">${mt.rationale.map(x=>`<li><span class="tick">✓</span>${esc(x)}</li>`).join("")}</ul>
    </div>
    <div style="margin-top:14px"><button class="btn sm" data-build="${mt.slug}">Build my roadmap →</button></div>
  </div>`;
}

/* ── Roadmap ── */
function buildRoadmap(slug){
  const career=CAREERS.find(c=>c.slug===slug);
  const gaps=skillGaps(career, state.held);
  const ranked=rankOpportunities(gaps, OPPS, state.ctx);
  const rm=generateRoadmap(career, gaps, ranked);
  const matchScore=(state.matches.find(m=>m.slug===slug)||{}).score||0;
  state.roadmaps[slug]={ career, gaps, rm, matchScore };
  state.currentRoadmap=slug;
}
const PHASES=[["foundation","Foundation","Build the base skills and lock in your target"],["build","Build","Real experience through funded programs & internships"],["launch","Launch","Package your work and apply in"]];
const KIND_ICO={ skill:"📚", opportunity:"🎯", milestone:"🚩" };
const ST_LABEL={ NOT_STARTED:"Not started", IN_PROGRESS:"In progress", DONE:"Done" };
const ST_TONE={ NOT_STARTED:"gy", IN_PROGRESS:"na", DONE:"em" };
const ST_NEXT={ NOT_STARTED:"IN_PROGRESS", IN_PROGRESS:"DONE", DONE:"NOT_STARTED" };
function viewRoadmap(){
  const R=state.roadmaps[state.currentRoadmap]; const rm=R.rm;
  const done=rm.steps.filter(s=>s.status==="DONE").length, pct=Math.round(done/rm.steps.length*100);
  let phaseHtml="";
  for(const [key,label,cap] of PHASES){ const ps=rm.steps.filter(s=>s.phase===key); if(!ps.length) continue;
    phaseHtml+=`<div class="phase"><div class="plabel">${label}<span class="pcap">${cap}</span></div>${
      ps.map(s=>`<div class="step ${s.status==="DONE"?"done":""}"><span class="ico">${KIND_ICO[s.kind]}</span>
        <div class="body"><div class="t">${esc(s.title)} ${s.estWeeks?`<span class="sub" style="font-weight:400">· ~${s.estWeeks}w</span>`:""}</div><div class="d">${esc(s.description)}</div></div>
        <button class="chip ${ST_TONE[s.status]} statusbtn" data-step="${s.order}">${ST_LABEL[s.status]}</button></div>`).join("")
    }</div>`;
  }
  return `<div class="view"><div class="wrap">
    <div class="rm-head"><div><div class="eyebrow">Your roadmap</div><h1 class="display" style="font-size:1.7rem;margin-top:8px">Your path to ${esc(R.career.title)}</h1>
      <p class="sub">${R.gaps.length} skill gaps identified · ${rm.steps.length} steps · ~${rm.horizonMonths} months</p></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="chip em">${Math.round(R.matchScore)}% match</span><button class="btn sec sm" data-go="results">← All matches</button></div></div>
    <div class="rm-progress"><div class="pbar"><div style="width:${pct}%;background:var(--accent)"></div></div>
      <span class="mono" style="font-size:12px;color:var(--muted)">${done}/${rm.steps.length} done</span></div>
    <p class="sub" style="max-width:60ch">Every step is a concrete, affordable action — funded and need-blind options are ranked first. Click a status chip to track your progress.</p>
    ${phaseHtml}
    <div style="height:28px"></div>
  </div></div>`;
}

/* ── Sample profile (analytical / investigative respondent) ── */
function loadSample(){
  const resp={};
  for(const it of ITEMS){
    if(it.kind==="likert") resp[it.id]=it.reverse?2:4;
    else if(it.kind==="interest") resp[it.id]=(it.riasec==="I"||it.riasec==="C")?5:2;
    else if(it.kind==="task") resp[it.id]=it.answerIndex;
    else if(it.kind==="sjt"){ let bi=0; it.options.forEach((o,i)=>{ if(o.credit>it.options[bi].credit) bi=i; }); resp[it.id]=bi; }
  }
  state.responses=resp;
  state.ctx={ firstGen:true, needBlindOnly:false, maxCostUsd:1000, weeklyHours:12, locationState:"TX" };
  state.held=[{skillId:"spreadsheets",proficiency:.6},{skillId:"communication",proficiency:.5},{skillId:"math-fundamentals",proficiency:.5}];
  computeResults(); go("results");
}
function computeResults(){
  state.result=scorePotential(state.responses, state.ctx);
  state.matches=matchCareers({ dimensions:state.result.dimensions, riasec:state.result.riasec, heldSkills:state.held, constraints:state.ctx }, CAREERS);
}

/* ── Event binding (delegated per render) ── */
function bind(){
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const s1=document.getElementById("sample"); if(s1) s1.onclick=loadSample;
  const s2=document.getElementById("sample2"); if(s2) s2.onclick=loadSample;

  app.querySelectorAll(".opt,.choice").forEach(b=>b.onclick=()=>{ state.responses[b.dataset.item]=Number(b.dataset.val); render(); });

  const cost=document.getElementById("cx-cost"); if(cost) cost.oninput=e=>{ const v=e.target.value; state.ctx.maxCostUsd=v===""?undefined:Number(v); };
  const hrs=document.getElementById("cx-hours"); if(hrs) hrs.oninput=e=>{ const v=e.target.value; state.ctx.weeklyHours=v===""?undefined:Number(v); };
  const stt=document.getElementById("cx-state"); if(stt) stt.oninput=e=>{ state.ctx.locationState=e.target.value.toUpperCase()||undefined; };
  const fg=document.getElementById("cx-firstgen"); if(fg) fg.onchange=e=>{ state.ctx.firstGen=e.target.checked; };
  const nb=document.getElementById("cx-needblind"); if(nb) nb.onchange=e=>{ state.ctx.needBlindOnly=e.target.checked; };

  const sub=document.getElementById("submit"); if(sub) sub.onclick=()=>{ computeResults(); go("results"); };

  app.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{ document.getElementById("brk-"+b.dataset.toggle).classList.toggle("open"); b.textContent = document.getElementById("brk-"+b.dataset.toggle).classList.contains("open")?"Hide breakdown":"Why this match?"; });
  app.querySelectorAll("[data-build]").forEach(b=>b.onclick=()=>{ buildRoadmap(b.dataset.build); go("roadmap"); });

  app.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{ const R=state.roadmaps[state.currentRoadmap]; const st=R.rm.steps.find(s=>s.order===Number(b.dataset.step)); st.status=ST_NEXT[st.status]; render(); });
}

render();
</script>
