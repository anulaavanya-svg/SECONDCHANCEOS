name: Nila CI

# Runs only when the Nila desktop app changes, so it stays independent of the
# SecondChanceOS web platform in the same repository.
on:
  push:
    branches: ['**']
    paths:
      - 'nila/**'
      - '.github/workflows/nila-ci.yml'
  pull_request:
    paths:
      - 'nila/**'
      - '.github/workflows/nila-ci.yml'

defaults:
  run:
    working-directory: nila

jobs:
  build:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nila/package-lock.json

      # The Electron binary is not needed for typecheck/test/build, so skip the
      # download to keep CI fast and hermetic.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build bundles
        run: npx electron-vite build
